# PolarNova OpenTelemetry Collector (SigNoz distribution)
# Adapted from SigNoz Foundry ingester defaults + PolarNova hardening.
#
# Listen: OTLP gRPC :4317 / HTTP :4318 (container network only by default)
# Health: signoz_health_check :13133
# OpAMP:  manager config points at SigNoz service

connectors:
  signozmeter:
    metrics_flush_interval: 1h
    dimensions:
      - name: service.name
      - name: deployment.environment
      - name: deployment.environment.name
      - name: host.name
      - name: product
      - name: component

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 8
      http:
        endpoint: 0.0.0.0:4318
        # No public CORS — ingestion is private (Tailscale / Docker network)

  # Fleet-wide container logs. Tails every container's Docker json-file log on
  # this host (mounted read-only in the compose). Zero per-app work: foodiiz,
  # voxpilot, vital, etc. all ship stdout/stderr here. Logs are tagged with
  # container.id (the log file only carries the id, not the name); for friendly
  # per-app service.name + trace correlation, have each app export logs via OTLP
  # with OTEL_SERVICE_NAME instead of/in addition to this.
  filelog/dockercontainers:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: end
    include_file_path: true
    include_file_name: false
    operators:
      - type: json_parser
        id: parser-docker
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%LZ'
      - type: regex_parser
        id: extract-container-id
        parse_from: attributes["log.file.path"]
        regex: '^/var/lib/docker/containers/(?P<container_id>[0-9a-f]+)/.*$'
      - type: move
        from: attributes.container_id
        to: resource["container.id"]
      - type: move
        from: attributes.log
        to: body
      - type: remove
        field: attributes.time

processors:
  memory_limiter:
    check_interval: 2s
    # Keep below OTEL_MEMORY_LIMIT (default 1.5G). Tune via compose if needed.
    limit_mib: 1024
    spike_limit_mib: 256

  # Drop common sensitive keys from span/log attributes (defense in depth)
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.header.set-cookie
        action: delete
      - key: http.request.header.x-api-key
        action: delete
      - key: http.request.header.x-auth-token
        action: delete
      - key: authorization
        action: delete
      - key: api_key
        action: delete
      - key: apikey
        action: delete
      - key: password
        action: delete
      - key: secret
        action: delete
      - key: token
        action: delete
      - key: access_token
        action: delete
      - key: refresh_token
        action: delete
      - key: id_token
        action: delete
      - key: openai.api_key
        action: delete
      - key: prompt
        action: delete
      - key: completion
        action: delete
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: db.statement
        action: delete

  resource/defaults:
    attributes:
      - key: service.namespace
        value: polarnova
        action: upsert

  batch:
    send_batch_size: 8192
    send_batch_max_size: 10000
    timeout: 5s

  batch/meter:
    send_batch_size: 20000
    send_batch_max_size: 25000
    timeout: 5s

  signozspanmetrics/delta:
    metrics_exporter: signozclickhousemetrics
    metrics_flush_interval: 60s
    latency_histogram_buckets:
      [
        100us,
        1ms,
        2ms,
        6ms,
        10ms,
        50ms,
        100ms,
        250ms,
        500ms,
        1000ms,
        1400ms,
        2000ms,
        5s,
        10s,
        20s,
        40s,
        60s,
      ]
    dimensions_cache_size: 100000
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    enable_exp_histogram: true
    dimensions:
      - name: service.namespace
        default: polarnova
      - name: deployment.environment
        default: production
      - name: deployment.environment.name
        default: production
      - name: signoz.collector.id
      - name: service.version
      - name: product
      - name: component
      - name: host.name

extensions:
  signoz_health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 127.0.0.1:1777

exporters:
  clickhousetraces:
    datasource: tcp://clickhouse:9000/signoz_traces
    low_cardinal_exception_grouping: ${env:LOW_CARDINAL_EXCEPTION_GROUPING}
    use_new_schema: true
    timeout: 45s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000

  signozclickhousemetrics:
    dsn: tcp://clickhouse:9000/signoz_metrics
    timeout: 45s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000

  clickhouselogsexporter:
    dsn: tcp://clickhouse:9000/signoz_logs
    use_new_schema: true
    timeout: 45s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000

  signozclickhousemeter:
    dsn: tcp://clickhouse:9000/signoz_meter
    timeout: 45s
    sending_queue:
      enabled: false

  metadataexporter:
    cache:
      provider: in_memory
    dsn: tcp://clickhouse:9000/signoz_metadata
    enabled: true
    timeout: 45s

service:
  telemetry:
    logs:
      encoding: json
  extensions:
    - signoz_health_check
    - pprof
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        [
          memory_limiter,
          attributes/redact,
          resource/defaults,
          signozspanmetrics/delta,
          batch,
        ]
      exporters: [clickhousetraces, metadataexporter, signozmeter]

    metrics:
      receivers: [otlp]
      processors:
        [memory_limiter, attributes/redact, resource/defaults, batch]
      exporters: [signozclickhousemetrics, metadataexporter, signozmeter]

    logs:
      receivers: [otlp, filelog/dockercontainers]
      processors:
        [memory_limiter, attributes/redact, resource/defaults, batch]
      exporters: [clickhouselogsexporter, metadataexporter, signozmeter]

    metrics/meter:
      receivers: [signozmeter]
      processors: [memory_limiter, batch/meter]
      exporters: [signozclickhousemeter]
