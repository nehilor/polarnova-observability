# PolarNova ClickHouse Keeper — adapted from SigNoz Foundry defaults
keeper_server:
  coordination_settings:
    force_sync: false
    operation_timeout_ms: 10000
    raft_logs_level: warning
    session_timeout_ms: 30000
    snapshot_distance: 100000
    snapshots_to_keep: 3
  four_letter_word_white_list: '*'
  log_storage_path: /var/lib/clickhouse-keeper/coordination/log
  raft_configuration:
    server:
      - hostname: clickhouse-keeper
        id: 0
        port: 9234
  server_id: 0
  snapshot_storage_path: /var/lib/clickhouse-keeper/coordination/snapshots
  tcp_port: 9181
# Dual-stack: the Coolify Docker network resolves the `clickhouse-keeper`
# hostname to an IPv6 address, so ClickHouse connected to [IPv6]:9181 while the
# keeper only listened on IPv4 (0.0.0.0) → "Connection refused / ZooKeeper store
# not ready (code 999)" and the schema-migrator failed. Listen on IPv4 AND IPv6.
listen_host:
  - 0.0.0.0
  - '::'
logger:
  console: true
  level: information
