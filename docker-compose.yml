###############################################################################
# PolarNova Observability Platform
# Coolify v4 · Docker Compose · Ubuntu VPS · Traefik (Coolify-managed)
#
# Architecture aligned with SigNoz Foundry (post-v0.130):
#   ClickHouse 25.12.5 + ClickHouse Keeper + PostgreSQL metastore
#   SigNoz UI/API + SigNoz OTel Collector (ingester) + schema migrator
#   Uptime Kuma (synthetic checks — separate from APM)
#
# Coolify notes (official docs):
#   - Do NOT declare a custom Docker network (breaks Traefik routing).
#   - Do NOT publish host ports for the public UI — use expose + domain.
#   - Assign domain as https://observe.polarnova.io:8080 on service "signoz".
#   - OTLP must NOT be public — no 0.0.0.0 publish; use Tailscale (see docs).
#
# NOT included (by design): Grafana, Loki, Jaeger, GlitchTip, Prometheus server,
# Node Exporter, cAdvisor (privileged).
###############################################################################

name: polarnova-observability

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-security: &default-security
  security_opt:
    - no-new-privileges:true

services:
  # ---------------------------------------------------------------------------
  # One-shot: histogramQuantile UDF for SigNoz APM
  # ---------------------------------------------------------------------------
  init-clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.12.5}
    restart: "no"
    <<: *default-security
    # One-shot job: exits 0. In Coolify UI, exclude from stack health if prompted.
    labels:
      polarnova.io/oneshot: "true"
    volumes:
      - clickhouse-user-scripts:/var/lib/clickhouse/user_scripts
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        target="/var/lib/clickhouse/user_scripts/histogramQuantile"
        if [ -x "$${target}" ]; then
          echo "histogramQuantile already present"
          exit 0
        fi
        echo "Fetching histogram-quantile for $${node_os}/$${node_arch}"
        cd /tmp
        wget -q -O histogram-quantile.tar.gz \
          "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xzf histogram-quantile.tar.gz
        mv histogram-quantile "$${target}"
        chmod +x "$${target}"
        echo "histogramQuantile installed"
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # ClickHouse Keeper (Foundry default telemetry keeper — replaces ZooKeeper)
  # ---------------------------------------------------------------------------
  clickhouse-keeper:
    image: clickhouse/clickhouse-keeper:${CLICKHOUSE_VERSION:-25.12.5}
    restart: unless-stopped
    <<: *default-security
    entrypoint:
      - /usr/bin/clickhouse-keeper
      - --config-file=/etc/clickhouse-keeper/keeper.yaml
    volumes:
      - clickhouse-keeper-data:/var/lib/clickhouse-keeper
      - ./config/clickhouse-keeper/keeper.yaml:/etc/clickhouse-keeper/keeper.yaml:ro
    # No ports / expose — internal only
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-keeper-client",
          "-h",
          "localhost",
          "-p",
          "9181",
          "-q",
          "ls",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${KEEPER_CPU_LIMIT:-0.50}"
          memory: ${KEEPER_MEMORY_LIMIT:-512M}
        reservations:
          memory: 128M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # ClickHouse — telemetry store (traces / metrics / logs)
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.12.5}
    restart: unless-stopped
    <<: *default-security
    depends_on:
      clickhouse-keeper:
        condition: service_healthy
      init-clickhouse:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_CONFIG: /etc/clickhouse-server/config.yaml
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-user-scripts:/var/lib/clickhouse/user_scripts:ro
      - ./config/clickhouse/config.yaml:/etc/clickhouse-server/config.yaml:ro
      - ./config/clickhouse/functions.yaml:/etc/clickhouse-server/functions.yaml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # No ports — never publish ClickHouse
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${CLICKHOUSE_CPU_LIMIT:-2.00}"
          memory: ${CLICKHOUSE_MEMORY_LIMIT:-4G}
        reservations:
          cpus: "0.50"
          memory: 1G
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Schema migrator (one-shot) — Foundry: ready → bootstrap → sync → async
  # ---------------------------------------------------------------------------
  schema-migrator:
    image: signoz/signoz-otel-collector:${OTELCOL_VERSION:-v0.144.6}
    restart: on-failure
    <<: *default-security
    # One-shot migration job. In Coolify UI, exclude from stack health if prompted.
    labels:
      polarnova.io/oneshot: "true"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /signoz-otel-collector migrate ready &&
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # PostgreSQL — SigNoz metastore (Foundry default; replaces SQLite)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    restart: unless-stopped
    <<: *default-security
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signoz}
      POSTGRES_USER: ${POSTGRES_USER:-signoz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No ports — internal only
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-0.50}"
          memory: ${POSTGRES_MEMORY_LIMIT:-512M}
        reservations:
          memory: 128M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # SigNoz UI + API — Coolify domain: https://observe.polarnova.io:8080
  # ---------------------------------------------------------------------------
  signoz:
    image: signoz/signoz:${SIGNOZ_VERSION:-v0.134.0}
    restart: unless-stopped
    <<: *default-security
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      schema-migrator:
        condition: service_completed_successfully
    environment:
      SIGNOZ_SQLSTORE_PROVIDER: postgres
      SIGNOZ_SQLSTORE_POSTGRES_DSN: postgres://${POSTGRES_USER:-signoz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-signoz}?sslmode=disable
      SIGNOZ_TELEMETRYSTORE_PROVIDER: clickhouse
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_ALERTMANAGER_PROVIDER: signoz
      SIGNOZ_TOKENIZER_JWT_SECRET: ${SIGNOZ_JWT_SECRET:?Set SIGNOZ_JWT_SECRET in Coolify env}
      DOT_METRICS_ENABLED: ${DOT_METRICS_ENABLED:-true}
    # Coolify Traefik: expose only (do NOT map host ports)
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8080/api/v1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${SIGNOZ_CPU_LIMIT:-1.00}"
          memory: ${SIGNOZ_MEMORY_LIMIT:-1536M}
        reservations:
          memory: 512M
    logging: *default-logging
    labels:
      # Hint only — Coolify assigns the real Traefik labels from the UI domain
      polarnova.io/public: "true"
      polarnova.io/role: "signoz-ui"

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector — PRIVATE ingestion (Docker network + Tailscale)
  # Do NOT assign a public Coolify domain. Do NOT publish 0.0.0.0:4317/4318.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: signoz/signoz-otel-collector:${OTELCOL_VERSION:-v0.144.6}
    restart: unless-stopped
    <<: *default-security
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-migrator:
        condition: service_completed_successfully
      signoz:
        condition: service_healthy
    environment:
      OTEL_RESOURCE_ATTRIBUTES: host.name=${OTEL_HOST_NAME:-polarnova-observability},os.type=linux,deployment.environment=${DEPLOYMENT_ENVIRONMENT:-production},deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:-production}
      LOW_CARDINAL_EXCEPTION_GROUPING: ${LOW_CARDINAL_EXCEPTION_GROUPING:-false}
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    volumes:
      - ./config/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./config/otel/opamp-config.yaml:/etc/opamp-config.yaml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector \
          --config=/etc/otel-collector-config.yaml \
          --manager-config=/etc/opamp-config.yaml \
          --copy-path=/var/tmp/collector-config.yaml
    # Internal listeners only — no host publish in this file.
    # For Tailscale cross-VPS: see docker-compose.tailscale.yml override
    # or Coolify Ports bound to the Tailscale IP (never 0.0.0.0).
    expose:
      - "4317"
      - "4318"
      - "13133"
    # No image healthcheck: Foundry also omits one for the ingester.
    # Readiness: curl http://otel-collector:13133 from another container / Tailscale host.
    deploy:
      resources:
        limits:
          cpus: "${OTEL_CPU_LIMIT:-1.00}"
          memory: ${OTEL_MEMORY_LIMIT:-1536M}
        reservations:
          memory: 256M
    logging: *default-logging
    labels:
      polarnova.io/public: "false"
      polarnova.io/role: "otlp-ingestion"

  # ---------------------------------------------------------------------------
  # Uptime Kuma — synthetic monitoring (keep private until auth + domain ready)
  # Do NOT assign https://uptime.polarnova.io until admin user is created.
  # ---------------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_VERSION:-1.23.16}
    restart: unless-stopped
    <<: *default-security
    volumes:
      - uptime-kuma-data:/app/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "${UPTIME_CPU_LIMIT:-0.50}"
          memory: ${UPTIME_MEMORY_LIMIT:-384M}
        reservations:
          memory: 128M
    logging: *default-logging
    labels:
      polarnova.io/public: "false"
      polarnova.io/role: "uptime-kuma"

###############################################################################
# Volumes — named volumes only (survive redeploy / recreate / reboot)
# Do NOT bind-mount database data into the Git working tree.
###############################################################################
volumes:
  clickhouse-data:
    name: pn-obs-clickhouse-data
  clickhouse-keeper-data:
    name: pn-obs-clickhouse-keeper-data
  clickhouse-user-scripts:
    name: pn-obs-clickhouse-user-scripts
  postgres-data:
    name: pn-obs-postgres-data
  uptime-kuma-data:
    name: pn-obs-uptime-kuma-data

# Intentionally NO top-level networks: key.
# Coolify creates and attaches its own network so Traefik can reach "signoz".
