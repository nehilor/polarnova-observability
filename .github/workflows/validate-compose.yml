name: Validate Compose

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env for validation
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_BASE64_48/ci-validation-jwt-not-for-production/' .env
          sed -i 's/CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_BASE64_32/ci-validation-pg-not-for-production/' .env
          # Ensure tokenizer secret name exists for compose interpolation
          grep -q '^SIGNOZ_TOKENIZER_JWT_SECRET=' .env || echo 'SIGNOZ_TOKENIZER_JWT_SECRET=ci-validation-jwt-not-for-production' >> .env

      - name: Docker Compose config
        run: |
          # Coolify-only field; strip before schema validation
          grep -v 'exclude_from_hc:' docker-compose.yml > /tmp/docker-compose.validate.yml
          docker compose -f /tmp/docker-compose.validate.yml --env-file .env config --quiet

      - name: Referenced config files exist
        run: |
          test -f config/clickhouse/config.yaml
          test -f config/clickhouse/functions.yaml
          test -f config/clickhouse-keeper/keeper.yaml
          test -f config/otel/otel-collector-config.yaml
          test -f config/otel/opamp-config.yaml

      - name: Shellcheck scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts
        continue-on-error: true
